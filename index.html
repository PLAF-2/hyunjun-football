function notices(){return '<div class="page"><h1>공지사항</h1><p>팀 소식과 꼭 알아야 할 안내</p></div>'+admin()+'<div class="list" style="margin-top:17px">'+N.map(notice).join('')+'</div>'+(S.a?'<button class="fab" data-create="notice">＋ 공지 등록</button>':'')}
function nd(id){let n=N[id];return '<button class="back" style="color:var(--i);padding-top:10px" data-go="notices">← 공지 목록</button><article class="card">'+(id===0?'<span class="badge change">📌 중요 공지</span>':'')+'<h1 style="font-size:25px;margin-top:14px">'+n[0]+'</h1><small>2026. 10. '+(28-id)+'</small><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p style="font-size:15px;line-height:1.9">'+n[1]+'</p></article>'+(S.a?'<button class="primary" data-create="notice">공지 수정</button>':'')}
function members(){return '<div class="page"><h1>팀원</h1><p>plaf united와 함께하는 '+M.length+'명</p></div>'+admin()+(S.a?'<div class="card" style="margin:15px 0"><h3>가입 신청 2건</h3><button class="primary approve">윤태호 · MF 가입 승인</button><button class="primary approve">임성재 · DF 가입 승인</button></div>':'')+'<div class="member-grid" style="margin-top:17px">'+M.map(m=>'<article class="card member"><span class="num">'+m[1]+'</span><i class="avatar">'+m[0][0]+'</i><h3>'+m[0]+'</h3><p>#'+m[1]+' · '+m[2]+'</p><div>'+(T[m[0]]||[]).map(t=>'<span class="trait">'+t+'</span>').join('')+'</div><div class="member-actions"><button data-trait="'+m[0]+'">＋ 장점</button><button data-use="'+m[0]+'">전술 배치</button></div>'+(m[3]?'<span class="staff">'+m[3]+'</span>':'')+'</article>').join('')+'</div>'}
function lineup(mode){return S.active.map(i=>{let m=M[i];return '<button class="player-dot" style="left:'+S.positions[i][0]+'%;top:'+S.positions[i][1]+'%" data-player="'+i+'"><i>'+m[1]+'</i><small>'+m[0]+'</small></button>'}).join('')}function tactics(){return '<div class="page"><h1>전술 보드</h1><p>선수를 추가·제외하고 원하는 위치에 배치하세요</p></div><div class="tactic-top"><select class="formation" id="formation"><option '+(S.form==='2-3-1'?'selected':'')+'>2-3-1</option><option '+(S.form==='3-2-1'?'selected':'')+'>3-2-1</option><option '+(S.form==='2-2-2'?'selected':'')+'>2-2-2</option></select><button class="primary" style="width:auto;margin:0" data-save-tactic>전술 저장</button></div><div class="drag-note">선수를 마우스나 손가락으로 끌어 원하는 위치에 놓으세요</div><div class="pitch" id="tacticPitch">'+lineup('edit')+'</div><div class="squad-head"><h3>출전 명단</h3><span class="lineup-count">'+S.active.length+' / 7명</span></div><div class="squad-list">'+M.map((m,i)=>'<button class="squad-btn '+(S.active.includes(i)?'on':'')+'" data-toggle-player="'+i+'"><i class="avatar">'+m[1]+'</i><span>'+m[0]+'<small>'+m[2]+' · '+(S.active.includes(i)?'경기장':'벤치')+'</small></span><b>'+(S.active.includes(i)?'빼기':'＋ 추가')+'</b></button>').join('')+'</div><div class="card"><div class="row"><div><b>공격적 압박</b><p>빠른 전환 · 측면 오버랩</p></div><span class="badge">팀 케미 '+(78+S.active.length)+'</span></div><button class="primary" data-play>감독 모드 시작 ⚽</button></div>'}function managerGame(){return '<div class="page"><button class="back" style="color:var(--i)" data-go="tactics">← 전술판으로</button><h1>감독 모드</h1><p>내 전술이 경기장에서 움직이는 모습을 확인하세요</p></div><section class="card"><div class="row"><b>plaf united</b><span>'+S.minute+'분</span><b>한강 FC</b></div><div class="game-score">'+S.score[0]+' : '+S.score[1]+'</div><div class="pitch manager-pitch" id="managerPitch">'+lineup('game')+'<i class="ball" id="ball"></i></div><small>점유율 '+S.possession+'%</small><div class="meter"><i style="width:'+S.possession+'%"></i></div><div class="play-btns"><button data-action="press">전방 압박</button><button data-action="attack">빠른 역습</button><button data-action="control">점유 유지</button></div><button class="primary" data-action="next">'+(S.minute>=90?'새 경기 시작':'다음 10분 진행')+'</button><div class="commentary" style="margin-top:10px">'+S.log.slice().reverse().map(x=>'<div>• '+x+'</div>').join('')+'</div></section>'}
function traitModal(name){document.querySelector('#modal').innerHTML='<div class="shade"><section class="modal"><h2>'+name+' 선수의 장점</h2><p>경기에서 돋보이는 특징을 기록해 주세요.</p><input id="traitInput" placeholder="예: 빠른 판단, 강한 왼발"><button class="primary" data-save-trait="'+name+'">장점 저장</button><button class="primary" data-close style="background:white;color:var(--i)">닫기</button></section></div>'}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.p));clearInterval(animTimer);app.innerHTML=S.p==='home'?home():S.p==='schedule'?schedule():S.p==='tactics'?tactics():S.p==='manager'?managerGame():S.p==='notices'?notices():S.p==='members'?members():S.p.startsWith('game:')?detail(+S.p.split(':')[1]):nd(+S.p.split(':')[1]);if(S.p==='manager')setTimeout(startMatchAnimation,80);scrollTo(0,0)}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function modal(t){document.querySelector('#modal').innerHTML='<div class="shade"><section class="modal"><h2>'+(t==='game'?'경기 등록·수정':'공지 등록·수정')+'</h2><p>데모 화면입니다. 실제 저장은 다음 단계에서 연결됩니다.</p><input placeholder="제목 또는 상대 팀"><textarea placeholder="상세 내용을 입력하세요"></textarea><button class="primary" data-save>저장하기</button><button class="primary" data-close style="background:white;color:var(--i)">닫기</button></section></div>'}
function play(action){if(['press','attack','control'].includes(action))S.command=action;if(action==='next'&&S.minute>=90){S.score=[0,0];S.minute=0;S.log=['새 경기가 시작됩니다.'];S.possession=50;render();return}S.minute=Math.min(90,S.minute+10);let bonus=action==='attack'?0.42:action==='press'?0.34:action==='control'?0.26:0.3;if(action==='control')S.possession=Math.min(72,S.possession+6);if(action==='press')S.possession=Math.min(68,S.possession+3);if(action==='attack')S.possession=Math.max(42,S.possession-2);let r=Math.random();if(r<bonus){S.score[0]++;let hero=action==='attack'?'이민재의 스피드와 한지훈의 결정력':'정우진의 패스와 김도윤의 시야';S.log.push(S.minute+'분, 골! '+hero+'가 빛났습니다.')}else if(r>.82){S.score[1]++;S.log.push(S.minute+'분, 상대의 역습에 실점했습니다.')}else S.log.push(S.minute+'분, '+(action==='press'?'최현우의 태클로 높은 위치에서 공을 되찾았습니다.':action==='control'?'중원에서 침착하게 점유율을 높입니다.':'빠른 공격 전환이 아쉽게 막혔습니다.'));if(S.minute===90)S.log.push('경기 종료! 최종 스코어 '+S.score[0]+' : '+S.score[1]);render()}
let drag=null,animTimer=null;
function dragMove(e){if(!drag)return;let r=drag.pitch.getBoundingClientRect(),x=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100)),y=Math.max(6,Math.min(94,(e.clientY-r.top)/r.height*100));S.positions[drag.i]=[+x.toFixed(1),+y.toFixed(1)];drag.el.style.left=x+'%';drag.el.style.top=y+'%'}
document.addEventListener('pointerdown',e=>{let el=e.target.closest('#tacticPitch .player-dot');if(!el)return;e.preventDefault();drag={el,i:+el.dataset.player,pitch:document.querySelector('#tacticPitch')};el.classList.add('dragging');el.setPointerCapture(e.pointerId)})
document.addEventListener('pointermove',dragMove)
document.addEventListener('pointerup',()=>{if(!drag)return;drag.el.classList.remove('dragging');drag=null;toast('선수 위치를 변경했어요')})
function startMatchAnimation(){let pitch=document.querySelector('#managerPitch');if(!pitch)return;let tick=0;animTimer=setInterval(()=>{tick++;pitch.querySelectorAll('.player-dot').forEach(el=>{let i=+el.dataset.player,b=S.positions[i],role=i===0?0:i<3?1:i<6?2:3,dx=Math.sin(tick*.8+i)*3,dy=Math.cos(tick*.65+i)*2;if(S.command==='attack')dy-=role*2.3;if(S.command==='press')dy-=3;if(S.command==='control')dx*=1.8;el.style.left=Math.max(5,Math.min(95,b[0]+dx))+'%';el.style.top=Math.max(5,Math.min(95,b[1]+dy))+'%'});let ball=document.querySelector('#ball');if(ball){let owner=S.active[(tick+Math.floor(tick/3))%S.active.length],p=S.positions[owner];ball.style.left=Math.max(5,Math.min(95,p[0]+Math.sin(tick)*5))+'%';ball.style.top=Math.max(5,Math.min(95,p[1]+Math.cos(tick)*5))+'%'}},900)}
document.addEventListener('change',e=>{if(e.target.id==='formation'){S.form=e.target.value;toast(S.form+' 포메이션으로 변경했어요')}})
document.addEventListener('click',e=>{let b=e.target.closest('button,article');if(!b)return;if(b.dataset.tab||b.dataset.go){S.p=b.dataset.tab||b.dataset.go;render()}if(b.dataset.game){S.p='game:'+b.dataset.game;render()}if(b.dataset.notice!==undefined){S.p='notice:'+b.dataset.notice;render()}if(b.dataset.filter){S.f=b.dataset.filter;render()}if(b.dataset.vote){S.v[b.dataset.id]=b.dataset.vote;render();toast('참석 여부가 변경되었어요')}if(b.dataset.create)modal(b.dataset.create);if(b.dataset.trait)traitModal(b.dataset.trait);if(b.dataset.saveTrait){let v=document.querySelector('#traitInput').value.trim();if(v){T[b.dataset.saveTrait].push(v);b.closest('.shade').remove();render();toast('선수 장점을 저장했어요')}}if(b.dataset.togglePlayer!==undefined){let i=+b.dataset.togglePlayer;if(S.active.includes(i)){if(S.active.length<=1){toast('최소 1명은 경기장에 있어야 해요')}else{S.active=S.active.filter(x=>x!==i);toast(M[i][0]+' 선수를 벤치로 뺐어요')}}else if(S.active.length>=7){toast('경기장에는 최대 7명까지 배치할 수 있어요')}else{S.active.push(i);toast(M[i][0]+' 선수를 경기장에 추가했어요')}localStorage.setItem('plafTactic',JSON.stringify({form:S.form,positions:S.positions,active:S.active}));render()}if(b.dataset.use)toast(b.dataset.use+' 선수를 전술 후보로 선택했어요');if(b.dataset.swap)toast('선수를 선택했어요. 다른 선수를 눌러 교체하세요');if(b.dataset.saveTactic!==undefined){localStorage.setItem('plafTactic',JSON.stringify({form:S.form,positions:S.positions,active:S.active}));toast(S.form+' 전술과 선수 위치를 저장했어요')};if(b.dataset.play!==undefined){S.p='manager';render()}if(b.dataset.action)play(b.dataset.action);if(b.dataset.close)b.closest('.shade').remove();if(b.dataset.save){b.closest('.shade').remove();toast('데모 데이터에 저장했어요')}if(b.classList.contains('approve')){b.textContent='승인됨';b.disabled=true;toast('가입 신청을 승인했어요')}})
document.querySelector('#mode').onclick=()=>{S.a=!S.a;render();toast(S.a?'운영진 모드를 켰어요':'팀원 모드로 돌아왔어요')};render();
</script></body></html>
